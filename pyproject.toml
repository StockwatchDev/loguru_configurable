[project]
name = "loguru_configurable"
version = "0.3.0dev0"
description = "Wrapper that adds an application_settings ConfigSection to loguru"
license = "MIT"
readme = "README.md"
authors = [{ name = "Stockwatchdevs", email = "stockwatchdevs@gmail.com" }]
requires-python = ">=3.10,<4.0"
keywords = ["loguru", "logging", "configuration", "application_settings", "dataclass", "pydantic", "toml"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "application_settings (>=0.5.0)",
  "loguru (>=0.7)",
  "loguru-config (>=0.1)",
  "loguru-logging-intercept (>=0.1)",
]

[project.urls]
homepage = "https://github.com/StockwatchDev/loguru_configurable"
repository = "https://github.com/StockwatchDev/loguru_configurable"
documentation = "https://stockwatchdev.github.io/loguru_configurable/stable/"
changelog = "https://stockwatchdev.github.io/loguru_configurable/stable/CHANGELOG/"

[tool.poetry]
packages = [{ include = "loguru_configurable", from = "src" }]
include = [
  { path = "CHANGELOG.md", format = "sdist" },
  { path = "README.md", format = "sdist" },
  { path = "tests", format = "sdist" },
  { path = "examples", format = "sdist" },
]

[tool.poetry.group.testing]
optional = true

[tool.poetry.group.testing.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0.0"
packaging = ">=26.2"

[tool.poetry.group.testrunner]
optional = true

[tool.poetry.group.testrunner.dependencies]
tox = ">=4.53.0"

[tool.poetry.group.style]
optional = true

[tool.poetry.group.style.dependencies]
black = ">=25.0"
isort = ">=5.12.0"
pylint = ">=4.0"

[tool.poetry.group.typing]
optional = true

[tool.poetry.group.typing.dependencies]
mypy = ">=1.1.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.5"
mkdocs-gen-files = ">=0.5"
mkdocs-include-markdown-plugin = ">=6.0"
mkdocs-literate-nav = ">=0.6"
mkdocs-material = ">=9.2"
mkdocstrings-python = ">=1.5"
pymdown-extensions = ">=10.1"
# mkdocs-with-pdf = ">=0.9"

[tool.poetry.requires-plugins]
poetry-bumpversion = ">=0.3"
poetry-plugin-export = ">=1.8"

[[tool.poetry_bumpversion.replacements]]
files = ["README.md"]
search = '- version {current_version} #'
replace = '- version {new_version} #'

[tool.poetry_bumpversion.file."CHANGELOG.md"]
search = '## [Version {current_version}] - Unreleased ##'
replace = '## [Version {new_version}] - Unreleased ##'

[tool.poetry_bumpversion.file."src/loguru_configurable/_version.py"]

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.pylint.MAIN]
load-plugins = [
  "pylint.extensions.bad_builtin",
  "pylint.extensions.code_style",
  "pylint.extensions.typing",
  "pylint.extensions.no_self_use",
]

[tool.pylint.messages_control]
# Reasons disabled:
# format - handled by black
# wrong-import-order - isort guards this
# fixme - too handy for now
# consider-using-f-string - str.format sometimes more readable
# broad-except - general exceptions are acceptable
# ---
# Enable once current issues are fixed:
disable = ["fixme", "format", "wrong-import-order", "broad-except"]
enable = [
  "useless-suppression",          # temporarily every now and then to clean them up
  "use-symbolic-message-instead",
]

[tool.pylint.TYPECHECK]
mixin-class-rgx = ".*[Mm]ix[Ii]n"

[tool.pylint.TYPING]
runtime-typing = false

[tool.pylint.similarities]
ignore-imports = "yes"

[tool.isort]
line_length = 119
profile = "black"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
show_error_codes = true
show_error_context = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.black]
line-length = 119

[tool.tox]
legacy_tox_ini = """
# Tox configuration file
# Read more under https://tox.readthedocs.org/
[tox]
isolated_build = true

envlist =
    py{310,311,312,313}-testing
    py{310,311,312,313}-typing
    style
    docs

[testenv]
allowlist_externals = poetry

[testenv:py{310,311,312,313}-testing]
commands_pre =
    poetry install --no-root --with testing -v
commands =
    poetry run python -m pytest --cov-report xml:coverage.xml --cov-report term-missing --cov=loguru_configurable tests/ --import-mode importlib

[testenv:py{310,311,312,313}-typing]
skip_install = true
commands_pre =
    poetry install --with typing -v
commands =
    poetry run mypy ./src

[testenv:docs]
skip_install = true
commands_pre =
    poetry install --with docs -v
commands =
    poetry run mkdocs build -f ./docs/mkdocs.yml -d ../site

[testenv:style]
skip_install = true
commands_pre =
    poetry install --with style -v
commands =
    poetry run python -m black --check ./src
    poetry run isort --check --diff ./src
    poetry run pylint ./src
"""

[tool.virex]
poetry_version = "2.3.0"
python_version = "3.13.11"
